services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # Pull the default Attacker + Judge brains on first run.
    # Run once: docker compose exec ollama ollama pull deepseek-r1
    #           docker compose exec ollama ollama pull llama3.1

  neuralstrike:
    build: .
    image: neuralstrike:1.0.0
    depends_on:
      - ollama
    environment:
      NEURALSTRIKE_OLLAMA_BASE_URL: http://ollama:11434
      NEURALSTRIKE_ATTACKER_MODEL: deepseek-r1
      # Decision D1: the Judge is intentionally a STRONGER, DISTINCT model
      # from the Attacker, with the fallback chain from .env.example. The old
      # llama3.1 pin was the fail-open default D1 declared a bug.
      NEURALSTRIKE_JUDGE_MODEL: deepseek-v3.1:671b-cloud
      NEURALSTRIKE_JUDGE_MODEL_FALLBACKS: '["kimi-k2.6:cloud","gpt-oss:120b-cloud","deepseek-r1:8b"]'
      NEURALSTRIKE_REDACT_LOGS: "true"
    # Run a one-shot command; override with: docker compose run --rm neuralstrike <cmd>
    command: ["--help"]
    profiles:
      - cli

volumes:
  ollama-models: