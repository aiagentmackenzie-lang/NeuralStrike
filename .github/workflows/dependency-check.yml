name: Dependency check (scheduled)

# The supply-chain job in ci.yml proves the locks were clean at *that commit*. It says nothing
# about a commit that is a month old, and that is the failure the master plan names: "a historical
# green CI badge cannot imply current dependency health".
#
# This job is a health signal, not a release gate. It publishes nothing, builds no artifact and
# moves no tag. An advisory count is also not a vulnerability count: findings are triaged for
# reachability (see docs/implementation/DEPENDENCY_REVIEW.md) rather than counted as exploits.

on:
  schedule:
    # Mondays 06:17 UTC, off the hour to avoid the busiest runner window.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      # A finding fails the job on purpose: silence is the thing being fixed. The JSON record is
      # written even when the command exits non-zero, and is uploaded below with `if: always()`.
      - name: Audit the pinned runtime lock
        run: |
          pip-audit --require-hashes -r requirements.txt --format json > runtime-audit.json

      - name: Audit the pinned development lock
        run: |
          pip-audit --require-hashes -r requirements-dev.txt --format json > dev-audit.json

      - name: Upload audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: "*-audit.json"
          if-no-files-found: error
          retention-days: 90
